run_name: nq-jina-chunk1024-chat-r025-maxbatch-20261019-retry
dataset: dapr-nq-open
dataset_prefix: /mnt/nvme1/datasets
eval_script: run/eval_jina_chunk_regions.sh
results_root: outputs/grid_search
fixed_env:
  EVAL_BSZ: '32'
  JINA_AUTO_BATCH_MEMORY_PROBE: 'True'
  MODEL_NAME: meta-llama/Llama-3.1-8B-Instruct
  MODEL_LOAD_IN_4BIT: 'False'
  MAX_NEW_TOKENS: '20'
  MEASURE_PROMPT_STATS: 'True'
  PROMPT_FORMAT: chat_system_user
  CHROMA_EMBED_BACKEND: bge_small_v1_5
  CHROMA_EMBED_DEVICE: cpu
  DATA_SUBDIR: sent-bge-small-v1.5-512-splitlong180-headerless
  COLBERT_MODEL_NAME: jinaai/jina-colbert-v2
  COLBERT_QUERY_MAXLEN: '32'
  COLBERT_QUERY_MINLEN: ''
  COLBERT_QUERY_TRUNCATION_SIDE: right
  COLBERT_REGION_GROUP_ORDER: retrieval
  FINAL_TOKEN_BUDGET: ''
  TOTAL_NUM: ''
  DENSE_EMBED_DEVICE: cpu
  DENSE_EMBED_BATCH_SIZE: '128'
eval_fixed_env:
  USE_CLEANER: 'False'
  EVAL_USE_PAST_CACHE: 'False'
eval_groups:
- name: custom_nq_jina_chunk_context
eval_cases:
- COMPRESS_METHOD: colbert_sliding_region
  COLBERT_WINDOW_DIR: /mnt/nvme1/datasets/dapr-nq-open/sent-bge-small-v1.5-512-splitlong180-headerless/jina_colbert_chunk1024_2bit
  TOP_K: '20'
  RETAIN_TOKEN_RATIO: '0.25'
auto_eval_bsz:
  enabled: false
  min: 4
  max: 64
  step: 4
  search: binary
  probe_batches: 2
