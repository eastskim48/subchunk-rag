run_name: hotpotqa-0717-topk40
dataset: longbench-hotpotqa

dataset_prefix: /mnt/nvme1/datasets

eval_script: run/eval.sh
results_root: outputs/grid_07

fixed_env:
  EVAL_BSZ: "1"
  MODEL_NAME: "meta-llama/Llama-3.1-8B-Instruct"
  MODEL_LOAD_IN_4BIT: "False"
  MEASURE_PROMPT_STATS: "False"
  CHROMA_EMBED_BACKEND: "bge_small_v1_5"
  DATA_SUBDIR: sent-bge-small-v1.5-512-splitlong180
  EVAL_USE_PAST_CACHE: "False"
  COMPRESS_METHOD: colbert_sliding_region

eval_fixed_env:
  USE_CLEANER: "False"

eval_groups:
  - name: colbert_sliding_region

eval_axes:
  TOP_K:
    - "40"
  RETAIN_TOKEN_RATIO:
    - "0.05"
    - "0.1"
    - "0.15"
