run_name: hotpotqa-test
dataset: longbench-hotpotqa

dataset_prefix: /mnt/nvme1/datasets

eval_script: run/eval.sh
results_root: outputs/grid_07

fixed_env:
  EVAL_BSZ: "1"
  MODEL_NAME: "meta-llama/Llama-3.1-8B-Instruct"
  MODEL_LOAD_IN_4BIT: "False"
  MEASURE_PROMPT_STATS: "False"
  CHROMA_EMBED_BACKEND: "default"

eval_fixed_env:
  USE_CLEANER: "False"

preprocess_groups:
  - name: colbert_sliding_region

eval_axes:
  DATA_SUBDIR:
    - sent-default-512-splitlong180
  EVAL_USE_PAST_CACHE:
    - "False"
  COMPRESS_METHOD:
    - colbert_sliding_region
  TOP_K:
    - "10"
    - "20"
  RETAIN_TOKEN_RATIO:
    - "0.15"
    - "0.25"
    - "0.5"
    - "0.75"
