dataset: hotpotqa
dataset_prefix: /mnt/nvme1/datasets
eval_cases:
- COMPRESS_METHOD: materialized_dense_sliding_subchunk
  TOP_K: '20'
  RETAIN_TOKEN_RATIO: '0.25'
  EVAL_BSZ: '20'
  DENSE_EMBED_MODEL: BAAI/bge-small-en-v1.5
  DENSE_REGION_DIR: /mnt/nvme1/datasets/hotpotqa/sent-bge-small-v1.5-512-splitlong180-headerless-region120/bge_small_regions
eval_fixed_env:
  EVAL_USE_PAST_CACHE: 'False'
  USE_CLEANER: 'False'
eval_groups:
- name: custom_hotpotqa_headerless_chat
