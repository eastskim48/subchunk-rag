# Existing custom title-on HotpotQA corpus, all 7405 queries, seed 123.
run_name: hotpotqa-title-answerai-small-2bit-raw-top20-r025-bsz1-20261020
dataset: hotpotqa
dataset_prefix: /mnt/nvme1/datasets
eval_script: run/eval_full_corpus_regions.sh
results_root: outputs/grid_search
fixed_env:
  MODEL_NAME: meta-llama/Llama-3.1-8B-Instruct
  MODEL_LOAD_IN_4BIT: 'False'
  MAX_NEW_TOKENS: '20'
  MEASURE_PROMPT_STATS: 'True'
  PROMPT_FORMAT: raw_chunk_first
  CHROMA_EMBED_BACKEND: bge_small_v1_5
  CHROMA_EMBED_DEVICE: cpu
  DATA_SUBDIR: sent-bge-small-v1.5-512-splitlong180
  COLBERT_MODEL_NAME: answerdotai/answerai-colbert-small-v1
  COLBERT_WINDOW_DIR: /mnt/nvme1/datasets/hotpotqa/sent-bge-small-v1.5-512-splitlong180/colbert_answerai_small_window_2bit
  COLBERT_QUERY_MAXLEN: '32'
  COLBERT_QUERY_MINLEN: ''
  COLBERT_QUERY_TRUNCATION_SIDE: right
  COLBERT_REGION_GROUP_ORDER: retrieval
  FINAL_TOKEN_BUDGET: ''
  TOTAL_NUM: ''
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '32'
  MKL_NUM_THREADS: '32'
eval_fixed_env:
  USE_CLEANER: 'False'
  EVAL_USE_PAST_CACHE: 'False'
eval_groups:
- name: custom_hotpotqa_title_on_answerai_raw
eval_cases:
- COMPRESS_METHOD: colbert_sliding_region
  TOP_K: '20'
  RETAIN_TOKEN_RATIO: '0.25'
  EVAL_BSZ: '1'
