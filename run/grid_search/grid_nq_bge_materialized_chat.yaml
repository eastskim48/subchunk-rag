# Custom DAPR-NQ/NQ-open intersection, all2390 queries, shared frozen top20.
run_name: nq-bge-materialized-chat-top20-r025-bsz1-20261014
dataset: dapr-nq-open
dataset_prefix: /mnt/nvme1/datasets
results_root: outputs/grid_search
eval_script: run/eval_materialized_dense.sh

fixed_env:
  MODEL_NAME: meta-llama/Llama-3.1-8B-Instruct
  MODEL_LOAD_IN_4BIT: "False"
  MAX_NEW_TOKENS: "20"
  MEASURE_PROMPT_STATS: "True"
  PROMPT_FORMAT: chat_system_user
  DATA_SUBDIR: sent-bge-small-v1.5-512-splitlong180
  COLBERT_WINDOW_DIR: /mnt/nvme1/datasets/dapr-nq-open/sent-bge-small-v1.5-512-splitlong180/jina_colbert_window_2bit
  RETRIEVAL_SNAPSHOT: /mnt/nvme1/datasets/dapr-nq-open/sent-bge-small-v1.5-512-splitlong180/nq_top20_scorer_ablation_20261014/retrieval_snapshot.jsonl
  DENSE_EMBED_DEVICE: cpu
  DENSE_EMBED_BATCH_SIZE: "128"
  COLBERT_REGION_GROUP_ORDER: retrieval
  FINAL_TOKEN_BUDGET: ""

eval_fixed_env:
  USE_CLEANER: "False"
  EVAL_USE_PAST_CACHE: "False"

eval_groups:
  - name: custom_nq_materialized_dense_chat
    env:
      PROMPT_FORMAT: chat_system_user

eval_cases:
  - COMPRESS_METHOD: materialized_dense_sliding_subchunk
    DENSE_EMBED_MODEL: BAAI/bge-small-en-v1.5
    DENSE_REGION_DIR: /mnt/nvme1/datasets/dapr-nq-open/sent-bge-small-v1.5-512-splitlong180/nq_top20_scorer_ablation_20261014/bge_small_regions
    TOP_K: "20"
    RETAIN_TOKEN_RATIO: "0.25"
    EVAL_BSZ: "1"
  - COMPRESS_METHOD: materialized_dense_sliding_subchunk
    DENSE_EMBED_MODEL: BAAI/bge-m3
    DENSE_REGION_DIR: /mnt/nvme1/datasets/dapr-nq-open/sent-bge-small-v1.5-512-splitlong180/nq_top20_scorer_ablation_20261014/bge_m3_regions
    TOP_K: "20"
    RETAIN_TOKEN_RATIO: "0.25"
    EVAL_BSZ: "1"
