# Same NQ vanilla grid conditions; existing sentence/region512 DB reused without compression.
# Custom COVID-QA147-document shared corpus/all2019queries; existing NewsQA-style evaluator retained.
run_name: covidqa-vanilla-fixed-chunks-context-chat-b1-20261030
dataset: covid-qa-full-test
dataset_prefix: /mnt/nvme1/datasets
eval_script: run/eval_vanilla_grid_head.sh
results_root: /mnt/nvme1/dongseob/subchunk/outputs/temp
fixed_env:
  VANILLA_HEAD_CODE: /mnt/nvme1/dongseob/subchunk/outputs/temp/vanilla_chunk_suite_20261028/code
  MODEL_NAME: meta-llama/Llama-3.1-8B-Instruct
  MODEL_LOAD_IN_4BIT: 'False'
  MAX_NEW_TOKENS: '20'
  PROMPT_FORMAT: chat_system_user
  MEASURE_PROMPT_STATS: 'True'
  CHROMA_EMBED_BACKEND: bge_small_v1_5
  CHROMA_EMBED_DEVICE: cpu
  DENSE_EMBED_DEVICE: cpu
  EVAL_BSZ: '1'
  TOTAL_NUM: ''
  COMPRESS_METHOD: ''
  RETAIN_TOKEN_RATIO: ''
  FINAL_TOKEN_BUDGET: ''
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '32'
  MKL_NUM_THREADS: '32'
  TORCHRUN_MASTER_PORT: '29628'
  QUERY_FILE: /mnt/nvme1/dongseob/subchunk/outputs/temp/covid_denseon100_lateon_window_generation_20261030/queries.jsonl
  ANSWER_FILE: /mnt/nvme1/dongseob/subchunk/outputs/temp/covid_denseon100_lateon_window_generation_20261030/answers.jsonl
  DATASET: newsqa
  VANILLA_REUSE_SENTENCE_DB: '0'
eval_fixed_env:
  USE_CLEANER: 'False'
  EVAL_USE_PAST_CACHE: 'False'
eval_groups:
- name: vanilla_fixed_tokens_context_only_chat
eval_cases:
- DATA_SUBDIR: vanilla-bge-small-v1.5-128
