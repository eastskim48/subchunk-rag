- DATA_SUBDIR: vanilla-bge-small-v1.5-128
  DB_DIR: /mnt/nvme1/datasets/covid-qa-full-test/vanilla-bge-small-v1.5-128/db
  TOP_K: '10'
- DATA_SUBDIR: vanilla-bge-small-v1.5-256
  DB_DIR: /mnt/nvme1/datasets/covid-qa-full-test/vanilla-bge-small-v1.5-256/db
  TOP_K: '20'
- DATA_SUBDIR: vanilla-bge-small-v1.5-256
  DB_DIR: /mnt/nvme1/datasets/covid-qa-full-test/vanilla-bge-small-v1.5-256/db
  TOP_K: '10'
- DATA_SUBDIR: sent-bge-small-v1.5-512-splitlong100-lateon
