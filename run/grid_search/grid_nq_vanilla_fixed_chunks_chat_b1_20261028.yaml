# Run with the last-commit snapshot's run/grid_search/eval.py.
# Only the approved system/user prompt text differs from its vanilla inference code.
run_name: nq-vanilla-fixed-chunks-context-chat-b1-20261028
dataset: dapr-nq-open
dataset_prefix: /mnt/nvme1/datasets
eval_script: run/eval_vanilla_grid_head.sh
results_root: /mnt/nvme1/dongseob/subchunk/outputs/aaa_icde

fixed_env:
  VANILLA_HEAD_CODE: /mnt/nvme1/dongseob/subchunk/outputs/aaa_icde/vanilla_chunk_suite_20261028/code
  MODEL_NAME: "meta-llama/Llama-3.1-8B-Instruct"
  MODEL_LOAD_IN_4BIT: "False"
  MAX_NEW_TOKENS: "20"
  PROMPT_FORMAT: "chat_system_user"
  MEASURE_PROMPT_STATS: "True"
  CHROMA_EMBED_BACKEND: "bge_small_v1_5"
  CHROMA_EMBED_DEVICE: "cpu"
  DENSE_EMBED_DEVICE: "cpu"
  EVAL_BSZ: "1"
  TOTAL_NUM: ""
  COMPRESS_METHOD: ""
  RETAIN_TOKEN_RATIO: ""
  FINAL_TOKEN_BUDGET: ""
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "32"
  MKL_NUM_THREADS: "32"
  TORCHRUN_MASTER_PORT: "29628"

eval_fixed_env:
  USE_CLEANER: "False"
  EVAL_USE_PAST_CACHE: "False"

eval_groups:
