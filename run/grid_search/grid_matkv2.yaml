run_name: 2wiki-0708-default-3

dataset: longbench-2wiki

dataset_prefix: /mnt/nvme1/datasets

eval_script: run/eval.sh
results_root: outputs/grid_search_lim

fixed_env:
  EVAL_BSZ: "1"
  MODEL_NAME: "meta-llama/Llama-3.1-8B-Instruct"
  MODEL_LOAD_IN_4BIT: "False"
  MEASURE_PROMPT_STATS: "False"
  CHROMA_EMBED_BACKEND: "default"

eval_fixed_env:
  USE_CLEANER: "False"

preprocess_groups:
  - name: default_vanilla
    env:
      COMPRESS_METHOD: ""

eval_axes:
  DATA_SUBDIR:
    - matkv-default-128
    - matkv-default-256
    - matkv-default-512
  EVAL_USE_PAST_CACHE:
    - "False"
  TOP_K:
    - "10"
    - "20"
