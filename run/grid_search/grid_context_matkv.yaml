    env:
      DATA_SUBDIR: sent-title-test
      COMPRESS_METHOD: compare_all_materialized

eval_axes:
  COMPARE_EMBED_DEVICE:
    - cpu
  COMPRESS_METHOD:
    - compare_all_materialized
  GLOBAL_TOP_R:
    - "0.3"
    - "0.4"
    - "0.5"
    - "0.6"
  TOP_K:
    - "5"
    - "10"
    - "15"
    - "20"

