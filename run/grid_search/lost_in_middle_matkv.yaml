run_name: lost-in-the-middle-topk-sweep

dataset: longbench-hotpotqa

dataset_prefix: /mnt/nvme1/datasets

eval_script: run/eval.sh
results_root: outputs/grid_search_litm

fixed_env:
  EVAL_BSZ: "4"

eval_fixed_env:
  USE_CLEANER: "False"

preprocess_groups:
  - name: matkv_1024
    env:
      DATA_SUBDIR: matkv_1024
      COMPRESS_METHOD: ""

eval_axes:
  TOP_K:
    - "1"
    - "3"
    - "5"
    - "7"
    - "9"
    - "11"
    - "13"
    - "15"
    - "17"
    - "20"
  EVAL_USE_PAST_CACHE:
    - "False"
    - "True"
